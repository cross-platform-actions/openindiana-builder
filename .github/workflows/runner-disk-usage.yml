name: Runner disk usage

# Test branch only, not meant to be merged.
#
# Builds the image from the more-disk-space branch (256 GB disk, GCC 14 with
# cc, pkg flushing its downloads), boots it, checks the compiler and runs the
# dependency install from cross-platform-actions/action#172, measuring the
# disk both inside the VM and on the runner.

on:
  push:
    branches: [test/runner-disk-usage]
  workflow_dispatch:

env:
  MEASURE: |
    #!/bin/sh
    set -eu
    sync
    echo "== $1"
    find /home/runner/work/_temp -maxdepth 1 -type f -size +50M |
    while read -r file; do
      echo "download:  $(du -m --apparent-size "$file" | cut -f1) MiB $file"
    done
    find /home/runner/work/_temp /tmp -name disk.raw 2> /dev/null |
    while read -r image; do
      echo "image:     $image"
      echo "virtual:   $(du -m --apparent-size "$image" | cut -f1) MiB"
      echo "allocated: $(du -m "$image" | cut -f1) MiB"
    done
    df -m --output=target,size,used,avail /

  GUEST_REPORT: |
    sudo=$(command -v sudo || :)
    uname -a
    df -k / 2> /dev/null || df
    if command -v zfs > /dev/null; then
      $sudo zpool list
      $sudo zfs list -t all -o name,used,avail,refer,volsize,refreservation,compressratio
    fi
    $sudo swap -l || :
    $sudo swap -s || :
    $sudo dumpadm || :
    svcs -xv || :

jobs:
  openindiana:
    name: openindiana (more-disk-space build)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Install measuring script
        run: |
          printf '%s' "$MEASURE" > /tmp/measure.sh
          chmod +x /tmp/measure.sh
          /tmp/measure.sh 'runner before the build'

      - name: Clone the builder at the more-disk-space branch
        uses: actions/checkout@v6.1.0
        with:
          ref: more-disk-space
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y curl qemu-system-x86 qemu-utils zstd

      - name: Set permissions to allow using KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: '1.14.2'

      - name: Build image
        run: |
          git log --oneline -3
          ./build.sh 2026.10.30 x86-64 -var 'headless=true'

      - name: Serve image
        run: |
          mkdir -p /tmp/served
          mv output/openindiana-2026.10.30-x86-64.tar.zst /tmp/served/
          rm -rf output packer_cache
          ls -l /tmp/served
          nohup python3 -m http.server 8000 -d /tmp/served > /tmp/http.log 2>&1 &
          sleep 2
          curl -fsI http://localhost:8000/openindiana-2026.10.30-x86-64.tar.zst
          /tmp/measure.sh 'after the build'

      - name: Start VM
        uses: cross-platform-actions/action@master
        with:
          operating_system: openindiana
          version: '2026.10.30'
          architecture: x86-64
          image_url: http://localhost:8000/openindiana-2026.10.30-x86-64.tar.zst
          sync_files: false
          shutdown_vm: false

      - name: Measure runner after boot
        run: |
          rm -rf /tmp/served
          /tmp/measure.sh 'after the VM booted'

      - name: Report disk inside the VM after boot
        shell: cpa.sh {0} --sync-files none
        run: |
          ${{ env.GUEST_REPORT }}
          sudo pkg property flush-content-cache-on-success
          sudo du -sh /var/pkg /var/pkg/publisher

      - name: Compile with the system compiler
        shell: cpa.sh {0} --sync-files none
        run: |
          set -x
          ls -l /usr/bin/cc /usr/bin/c++ /usr/bin/gcc /usr/bin/g++
          cc --version
          c++ --version
          cd "$(mktemp -d)"
          printf '#include <stdio.h>\nint main(void) { puts("hello from C"); return 0; }\n' > hello.c
          printf '#include <iostream>\nint main() { std::cout << "hello from C++" << std::endl; }\n' > hello.cpp
          cc -Wall -o hello hello.c && ./hello
          c++ -Wall -o hellopp hello.cpp && ./hellopp
          gcc -Wall -o hello-gcc hello.c && ./hello-gcc
          g++ -Wall -o hellopp-gpp hello.cpp && ./hellopp-gpp
          file hello hellopp
          cc -m32 -o hello32 hello.c && ./hello32 && file hello32 || echo '32-bit build failed'

      - name: Install the dependencies from issue 172
        shell: cpa.sh {0} --sync-files none
        run: |
          time sudo pkg install --accept metapackages/build-essential developer/versioning/subversion developer/versioning/git text/gawk developer/build/gnu-make developer/build/pkg-config audio/mpg123 library/libogg library/libvorbis codec/flac library/libsndfile library/sdl2 developer/build/autoconf developer/build/autoconf-archive developer/build/automake developer/build/libtool library/libtool/libltdl developer/build/help2man developer/documentation-tool/doxygen library/audio/pulseaudio

      - name: Report disk inside the VM after installing
        shell: cpa.sh {0} --sync-files none
        run: |
          ${{ env.GUEST_REPORT }}
          sudo du -sh /var/pkg /var/pkg/publisher

      - name: Measure runner after installing
        run: /tmp/measure.sh 'after installing the dependencies'
